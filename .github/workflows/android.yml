name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#4A1A34' --iconBackgroundColorDark '#4A1A34' \
            --splashBackgroundColor '#F6F2F4' --splashBackgroundColorDark '#171116'
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign bundle
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > upload.keystore
          jarsigner -keystore upload.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar cycle-cue.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm upload.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: cycle-cue-android
          path: cycle-cue.aab

      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.olufunto.cyclecue
          releaseFiles: cycle-cue.aab
          track: internal
          status: completed
